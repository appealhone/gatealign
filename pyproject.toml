[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "appealhone-gatealign"
version = "0.1.0"
description = "从线上目标出发，逐层找出对应的评测指标，标出断链与缺失环节"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "appealhone" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://appealhone.github.io"
Repository = "https://github.com/appealhone/gatealign"
Issues = "https://github.com/appealhone/gatealign/issues"

[project.scripts]
gatealign = "gatealign:main"

[tool.setuptools]
py-modules = ["gatealign"]
